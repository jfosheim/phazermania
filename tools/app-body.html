  function updateTrack() {
    var m = byId[state.modelId], t = S.tracks[m.track] || {};
    var len = parseFloat(document.getElementById("tLen").value);
    var lug = parseFloat(document.getElementById("tLug").value);
    var teeth = parseInt(document.getElementById("tDriver").value, 10);
    var h = "";

    /* Length: governed by rails + tunnel, so anything off-stock needs the matching skid. */
    if (len === t.lengthIn) {
      h += '<div class="verdict ok"><span class="vlabel">Length OK</span><span>' + len +
        '" is what this sled came with. Direct swap on the stock skid.</span></div>';
    } else if (len < t.lengthIn) {
      h += '<div class="verdict warn"><span class="vlabel">Shorter than stock</span><span>Going from ' + t.lengthIn +
        '" down to ' + len + '" means the shorter rails and the matching skid. The tunnel stays, but you’ll have unsupported overhang at the back.</span></div>';
    } else {
      var isKnown = (t.lengthIn === 121 && (len === 136 || len === 133));
      h += '<div class="verdict warn"><span class="vlabel">Longer than stock</span><span>' + t.lengthIn + '" to ' + len + '" needs ' +
        (isKnown ? "the <b>ST long-track rails and skid</b> — Yamaha did exactly this swap themselves, which is what the ST models are. Track " +
                   esc("8BH-47110-00-00") + " is the 136." : "longer rails and almost certainly a <b>tunnel extension</b>.") +
        " Budget for the skid, not just the track.</span></div>";
    }

    /* Lug: the numbers builders report on this chassis (forum consensus, see Mods & upgrades). */
    if (lug <= 0.75) {
      h += '<div class="verdict ok"><span class="vlabel">Lug OK</span><span>' + lug +
        '" is at or near stock height. No clearance concerns.</span></div>';
    } else if (lug <= 1.25) {
      h += '<div class="verdict ok"><span class="vlabel">Lug OK</span><span>Up to 1&frac14;" is the most-reported <b>safe choice on the stock 8-tooth drivers</b>. ' +
        (lug === 1.25 ? "It is snug at the front of the tunnel, and the stock drivers are awkward to refit, but riders run it widely." : "Riders report plenty of room.") + "</span></div>";
    } else if (lug <= 1.5) {
      if (teeth === 8) {
        h += '<div class="verdict warn"><span class="vlabel">At the limit</span><span>1&frac12;" on 8-tooth drivers is reported to fit with about 3/8" to spare on one sled, ' +
          "but others say it slaps the tunnel and bulkhead under compression or when the track balloons. Drop brackets, or lowering the front arm about 5/8\", buy room. 7-tooth drivers make it comfortable.</span></div>";
      } else {
        h += '<div class="verdict ok"><span class="vlabel">Lug OK</span><span>1&frac12;" on 7-tooth drivers is a reported, workable combination. 7-tooth drivers gear the sled down about as much as two teeth off the top gear.</span></div>';
      }
    } else {
      h += '<div class="verdict ' + (teeth === 7 && lug <= 1.75 ? "warn" : "stop") + '"><span class="vlabel">' + (teeth === 7 && lug <= 1.75 ? "Tight" : "Needs work") + "</span><span>At " + lug +
        '" you need <b>7-tooth drivers</b>' + (lug > 1.75 ? ", and riders who run 2\" paddles have trimmed the front tunnel metal" : "; riders report 1&frac34;\" fits on them, tightly") +
        ". Snow evacuation and the track's bend over the smaller drivers both suffer.</span></div>";
      if (teeth === 8) {
        h += '<div class="verdict stop"><span class="vlabel">Driver conflict</span><span>You have 8-tooth selected. Nobody reports clearing more than 1&frac12;" on the stock drivers.</span></div>';
      }
    }
    h += '<p class="note">Lug clearances are forum-reported, from riders who have done the swap; Yamaha and Camoplast publish no maximum. Sources and detail on the <b>Mods &amp; upgrades</b> tab.</p>';
    document.getElementById("tResult").innerHTML = h;
  }

  /* ---------------- mods & upgrades ---------------- */

  /* ---------------- calculators ---------------- */
  function opts(list, sel, fmt) {
    return list.map(function (v) {
      return '<option value="' + v + '"' + (String(v) === String(sel) ? " selected" : "") + ">" + (fmt ? fmt(v) : v) + "</option>";
    }).join("");
  }
  function renderCalc(main) {
    var C = S.calc, G = S.gearRatios, cs = store.get("calc", {});
    var html = '<div class="sheet-head"><h2 class="sheet-title">Calculators</h2>' +
      '<div class="sheet-sub"><span>Gearing and top speed, premix and oil</span></div></div>';

    html += '<section class="group" id="gearCalc"><h2>Gearing and top speed</h2>' +
      '<div class="calc">' +
      '<div class="field"><label for="gDrive">Top sprocket</label><select id="gDrive">' + opts(G.drive, cs.drive || G.stdDrive, function (v) { return v + "T" + (v === G.stdDrive ? " (std)" : ""); }) + "</select></div>" +
      '<div class="field"><label for="gDriven">Bottom sprocket</label><select id="gDriven">' + opts(G.driven.map(function (r) { return r.teeth; }), cs.driven || G.stdDriven, function (v) { return v + "T" + (v === G.stdDriven ? " (std)" : ""); }) + "</select></div>" +
      '<div class="field"><label for="gTeeth">Drivers</label><select id="gTeeth">' + opts([8, 7], cs.teeth || 8, function (v) { return v + "-tooth" + (v === 8 ? " (stock)" : ""); }) + "</select></div>" +
      '<div class="field"><label for="gRpm">Engine rpm</label><input id="gRpm" type="number" inputmode="numeric" step="100" min="3000" max="10000" value="' + esc(cs.rpm || 7000) + '"></div>' +
      '<div class="field"><label for="gClutch">Clutch top ratio</label><input id="gClutch" type="number" inputmode="decimal" step="0.05" min="0.8" max="2" value="' + esc(cs.clutch || C.clutchRange.high) + '"></div>' +
      '</div><div id="gResult"></div>' +
      '<p class="note">Speed = engine rpm &divide; clutch ratio &divide; chaincase ratio &times; driver circumference (teeth &times; ' + C.driverPitchIn + '&quot; pitch). ' +
      "It is the track speed with no belt slip and the clutch fully shifted out. " + esc(C.clutchRange.source) +
      " Real top speed is lower; use this to compare one setup with another.</p></section>";

    html += '<section class="group" id="mixCalc"><h2>Premix and oil</h2>' +
      '<div class="prov">' + esc(C.autolube) + "</div>" +
      '<div class="calc">' +
      '<div class="field"><label for="pFuel">Fuel</label><input id="pFuel" type="number" inputmode="decimal" step="0.1" min="0" value="' + esc(cs.fuel || 8.4) + '"></div>' +
      '<div class="field"><label for="pUnit">Units</label><select id="pUnit">' + opts(["gal", "L"], cs.unit || "gal", function (v) { return v === "gal" ? "US gallons" : "Litres"; }) + "</select></div>" +
      '<div class="field"><label for="pRatio">Ratio</label><select id="pRatio">' + opts([24, 32, 40, 50, 100], cs.ratio || 32, function (v) { return v + ":1"; }) + "</select></div>" +
      '</div><div id="pResult"></div>' +
      '<p class="note">' + esc(C.premixNote) + " A full tank is " + esc(S.capacities.fuelTank) + " (1984&ndash;89 manual).</p></section>";

    main.innerHTML = html;
    ["gDrive", "gDriven", "gTeeth", "gRpm", "gClutch", "pFuel", "pUnit", "pRatio"].forEach(function (id) {
      var el = document.getElementById(id);
      el.addEventListener("input", updateCalc);
      el.addEventListener("change", updateCalc);
    });
    updateCalc();

  function mphFor(rpm, clutch, drive, driven, teeth) {
    var inPerMin = rpm / clutch / (driven / drive) * teeth * S.calc.driverPitchIn;
    return inPerMin * 60 / 63360;
  }
  function updateCalc() {
    var G = S.gearRatios, v = function (id) { return document.getElementById(id).value; };
    var drive = parseInt(v("gDrive"), 10), driven = parseInt(v("gDriven"), 10), teeth = parseInt(v("gTeeth"), 10);
    var rpm = parseFloat(v("gRpm")), clutch = parseFloat(v("gClutch"));
    var fuel = parseFloat(v("pFuel")), unit = v("pUnit"), ratio = parseInt(v("pRatio"), 10);
    store.set("calc", { drive: drive, driven: driven, teeth: teeth, rpm: rpm, clutch: clutch, fuel: fuel, unit: unit, ratio: ratio });

    var h;
    if (!(rpm > 0) || !(clutch > 0)) {
      h = '<div class="verdict warn"><span class="vlabel">Check inputs</span><span>Enter an engine rpm and a clutch ratio above zero.</span></div>';
    } else {
      var mph = mphFor(rpm, clutch, drive, driven, teeth);
      var std = mphFor(rpm, clutch, G.stdDrive, G.stdDriven, 8);
      var diff = (mph / std - 1) * 100;
      var row = G.driven.filter(function (r) { return r.teeth === driven; })[0];
      var links = row ? row.links[G.drive.indexOf(drive)] : null;
      h = '<div class="result"><div class="result-top">' +
        '<div><span class="biglabel">Theoretical top speed</span><span class="big">' + mph.toFixed(0) + ' mph</span></div>' +
        '<div><span class="biglabel">Kilometres</span><span class="big">' + (mph * 1.609344).toFixed(0) + " km/h</span></div></div>" +
        '<div class="readout"><span>Chaincase ratio <b>' + (driven / drive).toFixed(3) + "</b></span>" +
        "<span>Overall at top <b>" + (driven / drive * clutch).toFixed(2) + ":1</b></span>" +
        "<span>Chain <b>" + (links ? links + " links (Table 4)" : "no length in the chart; measure") + "</b></span>" +
        "<span>vs stock 17/29, 8T <b>" + (Math.abs(diff) < 0.05 ? "same" : (diff > 0 ? "+" : "") + diff.toFixed(1) + "%") + "</b></span></div></div>";
      if (diff < -0.05) h += '<div class="verdict ok"><span class="vlabel">Geared down</span><span>More pull for deep snow, taller lugs or a longer track; less top speed. This is the direction Yamaha gives for poor snow and rough terrain.</span></div>';
      else if (diff > 0.05) h += '<div class="verdict warn"><span class="vlabel">Geared up</span><span>More top speed only if the engine can still pull its peak rpm. If rpm drops on the lake, it is overgeared.</span></div>';
    }
    document.getElementById("gResult").innerHTML = h;

    var p;
    if (!(fuel > 0)) {
      p = '<div class="verdict warn"><span class="vlabel">Check inputs</span><span>Enter the amount of fuel.</span></div>';
    } else {
      var ml = (unit === "gal" ? fuel * 3785.41 : fuel * 1000) / ratio;
      p = '<div class="result"><div class="result-top">' +
        '<div><span class="biglabel">Oil to add</span><span class="big">' + (ml / 29.5735).toFixed(1) + " oz</span></div>" +
        '<div><span class="biglabel">Millilitres</span><span class="big">' + Math.round(ml) + " ml</span></div></div>" +
        '<div class="readout"><span>' + fuel + " " + (unit === "gal" ? "US gal" : "L") + " at <b>" + ratio + ":1</b></span>" +
        "<span>Per US gallon <b>" + (128 / ratio).toFixed(1) + " oz</b></span><span>Per litre <b>" + Math.round(1000 / ratio) + " ml</b></span></div></div>";
    }
    document.getElementById("pResult").innerHTML = p;
  }


  /* ---------------- maintenance schedule + service log ----------------
     Yamaha's interval table, plus a per-sled record of when each item was last
     done. Due-ness is worked out from the hours or miles typed in (whichever
     comes first, as Yamaha writes it) and, for seasonal items, from the date:
     a season is taken to start on 1 August. Saved in this browser only. */
  function svcKey() { var g = activeSled(); return g ? "g:" + g.id : state.modelId; }

  function svcStatus(it, rec) {
    var MT = S.maintenance, last = rec.done[it.key], H = parseFloat(rec.hours), MI = parseFloat(rec.miles);

      var iv = MT.intervals[a], st = null, w = "";

      if (a === "season") {
        st = !last ? "none" : last.date >= seasonStart() ? "ok" : "due";
        w = st === "ok" ? "done this season" : st === "none" ? "no record" : "not done since 1 Aug";
      } else if (!last) {
        st = "none"; w = "no record";
      } else {
        var dh = !isNaN(H) && last.hours !== "" && last.hours != null ? H - parseFloat(last.hours) : NaN;
        var dm = !isNaN(MI) && last.miles !== "" && last.miles != null ? MI - parseFloat(last.miles) : NaN;
        var lim = iv.km / 1.609344;
        var fh = isNaN(dh) ? NaN : dh / iv.hours, fm = isNaN(dm) ? NaN : dm / lim;
        var f = Math.max(isNaN(fh) ? -1 : fh, isNaN(fm) ? -1 : fm);

        else if (f >= 1) { st = "due"; w = "due"; }

        else { st = "ok"; w = (isNaN(fh) ? "" : (iv.hours - dh).toFixed(0) + " h") + (isNaN(fh) || isNaN(fm) ? "" : " / ") + (isNaN(fm) ? "" : (lim - dm).toFixed(0) + " mi") + " left"; }
      }

  function renderChanges(main) {
    var FIELDS = [
      { key: "track", label: "Track" }, { key: "slide", label: "Slide rail" },
      { key: "belt", label: "Drive belt" }, { key: "primarySpring", label: "Primary spring" },
      { key: "cdi", label: "CDI unit" }, { key: "coil", label: "Ignition coil" },
      { key: "brakeDisc", label: "Brake disc" }
    ];
    var FAMS = ["Phazer", "Phazer II", "Venture"];

    var html = '<div class="sheet-head"><h2 class="sheet-title">What changed, and when</h2>' +
      '<div class="sheet-sub"><span>One row per model line; consecutive years sharing a part number are collapsed into one run</span></div></div>';
    /* A model line is a family plus its variant, with the long-track suffix folded in,
       so a 1994 "Phazer II ST (LT)" continues the 1991-93 "Phazer II ST" line. */
    function lineOf(m) { return m.variant.replace(/\s*\(LT\)$/, ""); }

    FIELDS.forEach(function (f) {
      html += '<section class="group"><h2>' + esc(f.label) + "</h2>";
      FAMS.forEach(function (fam) {
        var ms = MODELS.filter(function (m) { return m.family === fam; })
                       .sort(function (a, b) { return a.year - b.year; });
        if (!ms.length) return;
        var lines = [];
        ms.forEach(function (m) { if (lines.indexOf(lineOf(m)) < 0) lines.push(lineOf(m)); });
        lines.forEach(function (ln) {
          /* Collapse consecutive years of this line that share the value. */
          var runs = [];
          ms.filter(function (m) { return lineOf(m) === ln; }).forEach(function (m) {
            var v = m[f.key];
            var last = runs[runs.length - 1];
            if (last && last.v === v) { last.to = m.year; last.models.push(m); }
            else runs.push({ v: v, from: m.year, to: m.year, models: [m] });
          });
          html += '<div style="margin-bottom:12px"><div class="rail-head">' + esc(ln) + "</div><div class=\"runs\">";
          runs.forEach(function (r, i) {
            if (i) html += '<span class="arrow">&rarr;</span>';
            var yrs = r.from === r.to ? String(r.from) : r.from + "–" + r.to;
            var codes = r.models.map(function (m) { return m.code; }).join(", ");
            html += '<div class="run' + (i ? " changed" : "") + '"><span class="years">' + yrs + "</span>" +
              '<button class="pn val" data-pn="' + esc(r.v) + '">' + esc(r.v) + "</button>" +
              '<span class="val" style="font-family:inherit">' + esc(codes) + "</span></div>";
          });
          html += "</div></div>";
        });
      });
      html += "</section>";
    });

    html += '<p class="note">Each row follows one model line (standard, LE, ST, XL, GT) through the years, so a change in a row is a real change for that sled. Click any number to copy it.</p>';
    main.innerHTML = html;
    wirePnButtons(main);
  }

  /* ---------------- tuning log ----------------
     Each entry: { id, date, modelId, alt, temp, main, pilot, plug, notes }.
     Saved in this browser; Export makes a CSV the rider can keep. */
  var PLUGS = ["Not checked", "Tan / light coffee (right)", "Grey or white (lean)", "Black, dry soot (rich)", "Wet or oily", "Other, see notes"];
  function logLoad() { var l = store.get("log", []); return Array.isArray(l) ? l : []; }
  function logSave(l) { store.set("log", l); }
  function todayIso() {
    var d = new Date(), z = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
  }
  function csvCell(v) { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function renderLog(main) {
    var log = logLoad();
    var draft = state.logDraft && state.lastPick ? state.lastPick : null;
    state.logDraft = false;
    var m = byId[state.modelId];
    var html = '<div class="sheet-head"><h2 class="sheet-title">Tuning log</h2>' +
      '<div class="sheet-sub"><span>What you ran, where, and how the plugs read. Saved in this browser only</span></div></div>';

    html += '<section class="group"><h2>New entry</h2><div class="calc">' +
      '<div class="field"><label for="lDate">Date</label><input id="lDate" type="date" value="' + todayIso() + '"></div>' +
      '<div class="field"><label for="lModel">Sled</label><select id="lModel">' + MODELS.map(function (x) {
        return '<option value="' + esc(x.id) + '"' + (x.id === m.id ? " selected" : "") + ">" + x.year + " " + esc(x.variant) + "</option>";
      }).join("") + "</select></div>" +
      '<div class="field"><label for="lAlt">Altitude (ft)</label><input id="lAlt" type="number" inputmode="numeric" value="' + esc(state.jet.alt) + '"></div>' +
      '<div class="field"><label for="lTemp">Temperature (&deg;F)</label><input id="lTemp" type="number" inputmode="numeric" value="' + esc(state.jet.temp) + '"></div>' +
      '<div class="field"><label for="lMain">Main jet</label><input id="lMain" type="text" value="' + esc(draft ? draft.main : S.carburetor.mainJetStd.size) + '"></div>' +
      '<div class="field"><label for="lPilot">Pilot jet</label><input id="lPilot" type="text" value="' + esc(S.carburetor.pilotJetStd.size) + '"></div>' +
      '<div class="field"><label for="lPlug">Plug reading</label><select id="lPlug">' +
        PLUGS.map(function (p) { return "<option>" + esc(p) + "</option>"; }).join("") + "</select></div>" +
      "</div>" +
      '<div class="field"><label for="lNotes">Notes</label><textarea id="lNotes" class="field-ta" placeholder="Snow, pipe, needle clip, how it pulled&hellip;"></textarea></div>' +
      '<div class="btnrow"><button type="button" class="btn primary" id="lAdd">Save entry</button></div>' +
      (draft ? '<p class="note">Altitude, temperature and main jet are filled in from the Jetting tab.</p>' : "") +
      "</section>";

    html += '<section class="group"><h2>Entries &mdash; ' + log.length + "</h2>";
    if (!log.length) {
      html += '<p class="empty">No entries yet. After a run, note the conditions and the plug colour here, and the pattern shows up over a season.</p>';
    } else {
      html += '<div class="tablewrap"><table><thead><tr><th>Date</th><th>Sled</th><th>Alt ft</th><th>&deg;F</th><th>Main</th><th>Pilot</th><th>Plugs</th><th>Notes</th><th></th></tr></thead><tbody>' +
        log.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id; }).map(function (e) {
          var mm = byId[e.modelId];
          return '<tr><td class="mono">' + esc(e.date) + "</td><td>" + (mm ? mm.year + " " + esc(mm.variant) : esc(e.modelId)) + "</td>" +
            '<td class="mono">' + esc(e.alt) + '</td><td class="mono">' + esc(e.temp) + '</td><td class="mono">#' + esc(e.main) +
            '</td><td class="mono">#' + esc(e.pilot) + "</td><td>" + esc(e.plug) + "</td><td>" + esc(e.notes) + "</td>" +
            '<td><button type="button" class="linkbtn" data-logdel="' + e.id + '">Delete</button></td></tr>';
        }).join("") + "</tbody></table></div>" +
        '<div class="btnrow"><button type="button" class="btn" id="lExport">Export CSV</button>' +
        '<button type="button" class="btn" id="lCopy">Copy as text</button></div>';
    }
    html += '<p class="note">The log lives in this browser on this device. Export it now and then to keep a copy, or to move it to another device.</p></section>';
    main.innerHTML = html;

    document.getElementById("lAdd").addEventListener("click", function () {
      var v = function (id) { return document.getElementById(id).value.trim(); };
      var l = logLoad();
      l.push({ id: Date.now(), date: v("lDate") || todayIso(), modelId: v("lModel"), alt: v("lAlt"), temp: v("lTemp"),
               main: v("lMain").replace(/^#/, ""), pilot: v("lPilot").replace(/^#/, ""), plug: v("lPlug"), notes: v("lNotes") });
      logSave(l); toast("Entry saved"); render();
    });
    Array.prototype.forEach.call(main.querySelectorAll("[data-logdel]"), function (b) {
      b.addEventListener("click", function () {
        if (!window.confirm("Delete this log entry?")) return;
        logSave(logLoad().filter(function (e) { return String(e.id) !== b.getAttribute("data-logdel"); })); render();
      });
    });
    var rows = function () {
      return logLoad().map(function (e) {
        var mm = byId[e.modelId];
        return [e.date, mm ? mm.year + " " + mm.variant + " (" + mm.code + ")" : e.modelId, e.alt, e.temp, e.main, e.pilot, e.plug, e.notes];
      });
    };
    var HEAD = ["Date", "Sled", "Altitude ft", "Temp F", "Main jet", "Pilot jet", "Plug reading", "Notes"];
    var ex = document.getElementById("lExport");
    if (ex) ex.addEventListener("click", function () {
      var csv = [HEAD].concat(rows()).map(function (r) { return r.map(csvCell).join(","); }).join("\n");
      try {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
        a.download = "phazermania-tuning-log.csv";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      } catch (e) { copyText(csv, "Download blocked here, CSV copied instead"); }
    });
    var cp = document.getElementById("lCopy");
    if (cp) cp.addEventListener("click", function () {
      copyText(rows().map(function (r) { return r.join(" | "); }).join("\n"), "Log copied");
    });
  }

  });

  var qEl = document.getElementById("q");
  qEl.addEventListener("input", function () { state.q = qEl.value; render(); });

  orderSave();
  syncChrome();
  renderList();

  /* Offline: only the GitHub Pages build links a manifest and ships sw.js. */
  if ("serviceWorker" in navigator && window.isSecureContext && document.querySelector('link[rel="manifest"]')) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () { /* offline mode unavailable */ }); });
  }
})();
</script>
