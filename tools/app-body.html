<title>PhazerMania</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Cold instrument-panel palette: overcast snow, Yamaha racing blue.
     Red is reserved for the factory-STD flag and hard warnings - never decoration. */
  :root {
    --ground:      #E8ECEF;
    --surface:     #FFFFFF;
    --surface-2:   #F2F5F7;
    --line:        #CBD4DB;
    --line-soft:   #DEE5EA;
    --ink:         #0F161C;
    --muted:       #5B6874;
    --accent:      #0B4DA2;
    --accent-soft: #E3ECF8;
    --flag:        #B72B26;
    --flag-soft:   #FAE6E5;
    --alt:         #6B5A16;
    --alt-soft:    #F5EFD8;
    --ok:          #1F6B45;
    --ok-soft:     #E0F0E7;
    --chipfg:      #FFFFFF;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#0C1116; --surface:#141B22; --surface-2:#1B242C;
      --line:#2C3942; --line-soft:#222D35; --ink:#E3EAF0; --muted:#94A3B0;
      --accent:#6BA8F0; --accent-soft:#16283F;
      --flag:#F08A85; --flag-soft:#34191A;
      --alt:#D9C377; --alt-soft:#2E2814;
      --ok:#7FD3A5; --ok-soft:#14291F;
      --chipfg:#08121C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground:#0C1116; --surface:#141B22; --surface-2:#1B242C;
    --line:#2C3942; --line-soft:#222D35; --ink:#E3EAF0; --muted:#94A3B0;
    --accent:#6BA8F0; --accent-soft:#16283F;
    --flag:#F08A85; --flag-soft:#34191A;
    --alt:#D9C377; --alt-soft:#2E2814;
    --ok:#7FD3A5; --ok-soft:#14291F;
    --chipfg:#08121C;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  .shell { max-width: 1240px; margin: 0 auto; padding: 0 20px 64px; }

  .masthead {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 24px;
    padding: 26px 0 16px; border-bottom: 2px solid var(--ink);
  }
  .wordmark {
    font-family: Oswald, "Arial Narrow", sans-serif; font-weight: 600;
    font-size: clamp(28px, 4.2vw, 42px); letter-spacing: .04em;
    text-transform: uppercase; line-height: 1; margin: 0;
  }
  .wordmark em { font-style: normal; color: var(--accent); }
  .masthead-meta { margin-left: auto; text-align: right; font-size: 12px; color: var(--muted); line-height: 1.45; }
  .masthead-meta strong { color: var(--ink); font-weight: 600; }

  /* Five sections across the top on a laptop; a fixed bar at the bottom on a phone. */
  .secnav { display: flex; gap: 0; border-bottom: 1px solid var(--line); }
  .sectab {
    flex: none; white-space: nowrap;
    font-family: Oswald, "Arial Narrow", sans-serif; font-size: 15px; font-weight: 500;
    letter-spacing: .07em; text-transform: uppercase;
    background: none; border: 0; border-bottom: 3px solid transparent;
    color: var(--muted); padding: 12px 20px 9px; cursor: pointer; margin-bottom: -1px;
  }
  .sectab:hover { color: var(--ink); }
  .sectab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
  .sectab .short { display: none; }
  .badge { display: inline-block; min-width: 18px; padding: 2px 5px; margin-left: 6px; border-radius: 9px;
           background: var(--accent); color: var(--chipfg); font: 600 10.5px/1.2 "IBM Plex Sans", sans-serif;
           letter-spacing: 0; text-align: center; vertical-align: 2px; }

  .topbar { display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px; padding: 14px 0 12px; }
  .sledpick {
    display: flex; align-items: center; gap: 8px; flex: 0 1 360px; min-width: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 0 10px;
  }
  .sledpick:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .sledpick select {
    flex: 1; min-width: 0; border: 0; background: none; color: var(--ink); outline: none;
    font: 500 14px/1.2 "IBM Plex Sans", sans-serif; padding: 10px 0;
  }
  .pagenav { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 14px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
  .pagebtn {
    font: 500 13px/1 "IBM Plex Sans", sans-serif; padding: 8px 12px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); border-radius: 999px; cursor: pointer;
  }
  .pagebtn:hover { border-color: var(--accent); color: var(--accent); }
  .pagebtn[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--chipfg); }
  .pagebtn .badge { background: var(--chipfg); color: var(--accent); }
  .pagebtn:not([aria-current="page"]) .badge { background: var(--accent); color: var(--chipfg); }

  @media (max-width: 720px) {
    .secnav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; border: 0; border-top: 1px solid var(--line);
      background: var(--surface); padding-bottom: env(safe-area-inset-bottom);
    }
    .sectab {
      flex: 1 1 0; min-width: 0; padding: 12px 2px 11px; font-size: 13px; letter-spacing: .04em;
      border-bottom: 0; border-top: 3px solid transparent; margin: 0;
    }
    .sectab[aria-current="page"] { border-top-color: var(--accent); background: var(--accent-soft); }
    .sectab .long { display: none; }
    .sectab .short { display: inline; }
    .sectab .badge { margin-left: 3px; }
    .shell { padding-bottom: 92px; }
    .toast { bottom: 84px !important; }
    .sledpick { flex: 1 1 100%; }
    .pagebtn { padding: 8px 10px; }
  }

  /* Search results and the row a result points at. */
  .rgroup { margin-bottom: 26px; }
  .rgroup > h2 { font: 500 11px/1 "IBM Plex Sans", sans-serif; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 8px; padding-bottom: 7px; border-bottom: 1px solid var(--line); }
  .ritem { display: block; width: 100%; text-align: left; cursor: pointer; font: inherit; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); padding: 10px 14px; margin-bottom: 6px; }
  .ritem:hover { border-color: var(--accent); }
  .ritem .rhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 14px; }
  .ritem .rt { font-weight: 600; }
  .ritem .rv { font-variant-numeric: tabular-nums; font-weight: 500; }
  .ritem .rs { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .flash { animation: flash 2.2s ease-out; }
  @keyframes flash { 0%, 40% { background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent); } 100% { background: transparent; box-shadow: none; } }
  .quick .specgrid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .quick .spec dd { font-size: 16px; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .chipset { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: 500 12px/1 "IBM Plex Sans", sans-serif; letter-spacing: .04em; text-transform: uppercase;
    padding: 7px 11px; border: 1px solid var(--line); background: var(--surface);
    color: var(--muted); border-radius: 2px; cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .chip:hover { border-color: var(--accent); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--chipfg); }

  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 2px;
    padding: 0 10px; min-width: 0; flex: 1 1 300px;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search input {
    flex: 1; border: 0; background: none; color: var(--ink);
    font: 400 14px/1 "IBM Plex Mono", monospace; padding: 10px 0; outline: none; min-width: 0;
  }
  .search input::placeholder { color: var(--muted); font-family: "IBM Plex Sans", sans-serif; }
  .search-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  /* Label above a run of boxes on the Year changes page. */
  .rail-head { font: 500 11px/1 "IBM Plex Sans", sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-bottom: 8px; }

  .sheet-head { padding-bottom: 14px; border-bottom: 2px solid var(--ink); margin-bottom: 22px; }
  .sheet-title {
    font-family: Oswald, sans-serif; font-size: clamp(24px, 3.4vw, 34px); font-weight: 500;
    letter-spacing: .03em; text-transform: uppercase; margin: 0; line-height: 1.05; text-wrap: balance;
  }
  .sheet-sub { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .sheet-sub .mono { color: var(--ink); }

  .group { margin-bottom: 28px; }
  .group > h2 {
    font: 500 11px/1 "IBM Plex Sans", sans-serif; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 10px; padding-bottom: 7px; border-bottom: 1px solid var(--line);
  }

  .specgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 0 24px; }
  .spec { display: flex; align-items: baseline; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line-soft); }
  .spec dt { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); flex: none; }
  .spec dd { margin: 0 0 0 auto; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
  .spec dd .pn { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  .gap { color: var(--muted); font-weight: 400; font-style: italic; }

  .trackfig {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px;
    background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    padding: 14px 16px; margin-bottom: 12px;
  }
  .trackfig .dim { font-family: Oswald, sans-serif; font-size: 30px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1; }
  .trackfig .dimnote { font-size: 13px; color: var(--muted); }
  .trackfig .pn { margin-left: auto; }

  .ladder { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 8px; }
  .rung { flex: none; text-align: center; min-width: 62px; border: 1px solid var(--line); background: var(--surface); padding: 6px 4px; cursor: pointer; }
  .rung:hover { border-color: var(--accent); }
  .rung .sz { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 500; }
  .rung .rpn { font-size: 9px; color: var(--muted); font-family: "IBM Plex Mono", monospace; }
  .rung.is-std { background: var(--flag-soft); border-color: var(--flag); }
  .rung.is-std .sz { color: var(--flag); }
  .rung.is-target { background: var(--accent); border-color: var(--accent); }
  .rung.is-target .sz, .rung.is-target .rpn { color: var(--chipfg); }

  /* Highlighted cell in the factory altitude chart. */
  td.jcell { font-variant-numeric: tabular-nums; }
  td.jcell.is-hit {
    background: var(--accent); color: var(--chipfg); font-weight: 600;
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  td.jcell.is-hit .tag { background: rgba(255,255,255,.22); color: var(--chipfg); }
  /* Mods & upgrades page. */
  .modnav { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 22px; }
  .modnav a {
    padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px;
    font-size: 12.5px; color: var(--ink); text-decoration: none;
  }
  .modnav a:hover { border-color: var(--accent); color: var(--accent); }
  .mod { padding: 12px 0 14px; border-bottom: 1px solid var(--line-soft); max-width: 72ch; }
  .mod:last-child { border-bottom: 0; }
  .mod-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 4px; }
  .mod p { margin: 4px 0 0; line-height: 1.5; }
  .mod-warn { border-left: 3px solid var(--flag); padding-left: 12px; }
  .mod-pns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .mod-src { font-size: 12px; color: var(--muted); }
  .mod-src a { color: var(--muted); }

  /* 1984-89 chart: one chip per arrow, wrapping on a phone. */
  .jrange {
    display: inline-block; margin: 2px 6px 2px 0; padding: 3px 8px;
    border: 1px solid var(--line); border-radius: 6px; font-variant-numeric: tabular-nums;
  }
  .jrange .jr { font-family: inherit; font-size: 11.5px; color: var(--muted); margin-left: 4px; }
  .jrange.is-hit { background: var(--accent); color: var(--chipfg); border-color: var(--accent); font-weight: 600; }
  .jrange.is-hit .jr { color: var(--chipfg); }
  .jrange.is-hit .tag { background: rgba(255,255,255,.22); color: var(--chipfg); }

  /* Fiche link grid. */
  .fiches { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
  .fiche {
    display: block; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 6px; text-decoration: none; color: var(--ink);
    font-size: 12.5px; text-transform: capitalize; background: var(--surface);
  }
  .fiche:hover { border-color: var(--accent); color: var(--accent); }
  #jChart tbody tr:hover { background: transparent; }
  #jChart td { border-right: 1px solid var(--line-soft); }

  .tablewrap { overflow-x: auto; border: 1px solid var(--line); background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line-soft); }
  thead th {
    font: 500 10.5px/1 "IBM Plex Sans", sans-serif; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 1;
  }
  tbody tr:hover { background: var(--surface-2); }
  td.ref { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 12px; width: 42px; }
  td.pncell { width: 1%; white-space: nowrap; }
  .sectionrow td {
    background: var(--surface-2); font: 500 10.5px/1 "IBM Plex Sans", sans-serif;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink); border-bottom: 1px solid var(--line);
  }
  .sectionrow a { color: var(--accent); text-decoration: none; font-size: 10.5px; letter-spacing: .06em; }
  .sectionrow a:hover { text-decoration: underline; }

  .pn { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; background: none; border: 0; padding: 0;
        cursor: pointer; color: var(--ink); border-bottom: 1px dotted var(--line); }
  .pn:hover { color: var(--accent); border-bottom-color: var(--accent); }

  .tag { display: inline-block; font: 500 9.5px/1 "IBM Plex Sans", sans-serif; letter-spacing: .09em;
         text-transform: uppercase; padding: 3px 5px; border-radius: 2px; margin-left: 6px; vertical-align: 1px; }
  .tag-std { background: var(--flag-soft); color: var(--flag); }
  .tag-alt { background: var(--alt-soft); color: var(--alt); }
  .tag-warn { background: var(--alt-soft); color: var(--alt); }
  .tag-unconf { background: var(--surface-2); color: var(--muted); border: 1px dashed var(--line); }

  .hit { border: 1px solid var(--line); background: var(--surface); padding: 12px 14px; margin-bottom: 8px; }
  .hit-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
  .hit-desc { font-weight: 500; }
  .hit-fits { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .hit-fits b { color: var(--ink); font-weight: 500; }
  .empty { color: var(--muted); padding: 30px 0; }

  .note { font-size: 12px; color: var(--muted); line-height: 1.55; border-left: 2px solid var(--line); padding-left: 12px; margin: 10px 0 0; }
  .note strong { color: var(--ink); }
  a.diagram { color: var(--accent); font-size: 12px; text-decoration: none; }
  a.diagram:hover { text-decoration: underline; }

  /* ---- provenance banner: separates factory data from computed/community ---- */
  /* Block, not flex: inline <b> inside a flex container becomes a flex item and
     breaks the sentence into columns. */
  .prov { display: block; padding: 11px 14px; margin-bottom: 22px; max-width: 78ch;
          border: 1px solid var(--line); border-left: 3px solid var(--alt); background: var(--alt-soft); font-size: 12.5px; line-height: 1.55; }
  .prov b { color: var(--ink); }

  /* ---- calculator ---- */
  .calc { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font: 500 11px/1 "IBM Plex Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .field input, .field select {
    background: var(--surface); border: 1px solid var(--line); border-radius: 2px; color: var(--ink);
    font: 400 15px/1 "IBM Plex Mono", monospace; padding: 9px 10px; outline: none; width: 100%;
    font-variant-numeric: tabular-nums;
  }
  .field select { font-family: "IBM Plex Sans", sans-serif; }
  .field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .result { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 16px 18px; }
  .result-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px; }
  .result .big { font-family: Oswald, sans-serif; font-size: 38px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
  .result .biglabel { font: 500 11px/1 "IBM Plex Sans", sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
  .result .pnbig { font-family: "IBM Plex Mono", monospace; font-size: 15px; }
  .readout { display: flex; flex-wrap: wrap; gap: 4px 22px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-soft); font-size: 12.5px; color: var(--muted); }
  .readout b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }

  .verdict { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; margin-top: 10px; border: 1px solid var(--line); border-left: 3px solid var(--muted); background: var(--surface); font-size: 13.5px; line-height: 1.5; }
  .verdict.ok   { border-left-color: var(--ok);   background: var(--ok-soft); }
  .verdict.warn { border-left-color: var(--alt);  background: var(--alt-soft); }
  .verdict.stop { border-left-color: var(--flag); background: var(--flag-soft); }
  .verdict .vlabel { font: 500 10px/1.4 "IBM Plex Sans", sans-serif; letter-spacing: .09em; text-transform: uppercase; flex: none; padding-top: 2px; }
  .verdict.ok .vlabel { color: var(--ok); }
  .verdict.warn .vlabel { color: var(--alt); }
  .verdict.stop .vlabel { color: var(--flag); }

  .checklist { margin: 10px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); line-height: 1.7; }
  .checklist li::marker { color: var(--accent); }
  .checklist b { color: var(--ink); font-weight: 500; }

  /* ---- change timeline ---- */
  .runs { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
  .run { border: 1px solid var(--line); background: var(--surface); padding: 8px 11px; min-width: 168px; }
  .run .years { font-family: Oswald, sans-serif; font-size: 15px; letter-spacing: .04em; }
  .run .val { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); display: block; margin-top: 2px; }
  .run.changed { border-left: 3px solid var(--accent); }
  .arrow { align-self: center; color: var(--muted); font-size: 15px; }

  .diagimg { display: block; width: 100%; max-width: 560px; border: 1px solid var(--line); background: #fff; margin-top: 10px; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--ink); color: var(--ground); font: 500 13px/1 "IBM Plex Mono", monospace;
    padding: 11px 16px; border-radius: 2px; opacity: 0; pointer-events: none; transition: opacity .18s;
  }
  .toast.show { opacity: 1; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ---- source badges ---- */
  .tag-ok { background: var(--ok-soft); color: var(--ok); }
  .group > h2 .tag { vertical-align: 0; letter-spacing: .06em; }

  /* ---- buttons used by the order list and the log ---- */
  .btn {
    font: 500 12px/1 "IBM Plex Sans", sans-serif; letter-spacing: .04em; text-transform: uppercase;
    padding: 9px 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 2px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--chipfg); }
  .btn.primary:hover { color: var(--chipfg); filter: brightness(1.08); }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .addbtn {
    font: 500 11px/1 "IBM Plex Sans", sans-serif; padding: 4px 7px; margin-left: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--accent); border-radius: 2px; cursor: pointer;

<script>
(function () {
  "use strict";

    var done = function () { toast(pn + "  copied"); };

  }
  function wirePnButtons(scope) {
    Array.prototype.forEach.call(scope.querySelectorAll("[data-pn]"), function (b) {
      b.addEventListener("click", function () { copyPn(b.getAttribute("data-pn")); });

    });
    /* "+ list" buttons add a part to the order list. */
    Array.prototype.forEach.call(scope.querySelectorAll("[data-add]"), function (b) {
      var pn = b.getAttribute("data-add");

  }
  function addBtn(pn, qty) {
    return '<button type="button" class="addbtn" data-add="' + esc(pn) + '"' + (qty ? ' data-qty="' + qty + '"' : "") +

  }

  /* ================= order list =================
     [{ pn, qty }] kept in this browser. Descriptions come from the parts index,

  var order = (function () {
    var o = []; try { o = JSON.parse(localStorage.getItem("phazermania.order") || "[]"); } catch (e) { o = []; }
    return Array.isArray(o) ? o.filter(function (x) { return x && x.pn; }) : [];
  })();
  function orderSave() {
    try { localStorage.setItem("phazermania.order", JSON.stringify(order)); } catch (e) { /* keep in memory */ }
    if (PAGES[state.view]) renderNav();
  }
  function orderHas(pn) { return order.some(function (x) { return x.pn === pn; }); }
  function orderAdd(pn, qty) {
    var hit = order.filter(function (x) { return x.pn === pn; })[0];
    if (hit) { toast(pn + "  already on the list"); return; }

  function describe(pn) {

  }
  /* The models a part number is listed for, as "1990-93 Phazer II, ..." */
  function fitsText(pn) {

  }

  /* ================= sections and pages =================
     Five sections named for what a rider is trying to do, each holding a few
     pages. The sled picker and the search box sit above all of them. */
  var SECTIONS = [
    { id: "sled", label: "My sled", short: "My sled", pages: [
      { id: "specs",  label: "Quick specs", kw: "spec plug gap jet fuel oil capacity belt clutch rpm" },
      { id: "sheet",  label: "Full spec sheet", kw: "spec sheet engine carburettor carburetor print" },
      { id: "ident",  label: "Identify my sled", kw: "which sled serial number frame engine vin year identify" },
      { id: "garage", label: "My garage", kw: "garage my sleds saved" } ] },

      { id: "swap",     label: "Interchange", kw: "interchange swap donor fits compare" },

    { id: "tune", label: "Tune", short: "Tune", pages: [

      { id: "clutch",     label: "Clutching", kw: "clutch clutching spring weights primary secondary engagement shift altitude" },
      { id: "gearing",    label: "Gearing", kw: "gearing gear sprocket chain ratio top speed calculator" },
      { id: "suspension", label: "Suspension", kw: "suspension shock spring preload ride" },
      { id: "log",        label: "Tuning log", kw: "tuning log notes" } ] },
    { id: "fix", label: "Fix", short: "Fix", pages: [
      { id: "trouble", label: "Troubleshooting", kw: "troubleshooting won't start bog misfire problem symptom" },
      { id: "service", label: "Maintenance", kw: "maintenance service schedule interval premix oil mix" },
      { id: "torque",  label: "Torque specs", kw: "torque fastener bolt nut tighten" },
      { id: "limits",  label: "Service limits", kw: "service limits capacities crank runout deflection free play" } ] },
    { id: "mods", label: "Mods & history", short: "Mods", pages: [
      { id: "mods",    label: "Mods & upgrades", kw: "mods upgrades performance" },
      { id: "track",   label: "Track fit", kw: "track lug height length drivers fitment" },
      { id: "carbs",   label: "Carb swap", kw: "carb swap vmax flat slide tm38 conversion" },
      { id: "changes", label: "Year changes", kw: "year changes history what changed" } ] }
  ];
  var PAGES = {};
  SECTIONS.forEach(function (sec) { sec.pages.forEach(function (p) { p.sec = sec; PAGES[p.id] = p; }); });
  /* Old addresses keep working: these tabs were split or renamed. */
  var OLD_PAGES = { setup: "clutch", calc: "gearing" };
  function pageOf(id) { id = OLD_PAGES[id] || id; return PAGES[id] ? id : null; }
  function viewExists(id) { return !!pageOf(id); }
  var lastPage = {};

  /* ================= saved state + shareable links =================
     The address carries the sled and the page, e.g. #1992-pz480s/jetting, so a
     link opens the same page for someone else. The browser also remembers the
     last sled, the jetting inputs, the order list and the tuning log. All of it
     lives in this browser only; nothing is sent anywhere. */
  var store = {
    get: function (k, dflt) {
      try { var v = localStorage.getItem("phazermania." + k); return v == null ? dflt : JSON.parse(v); }
      catch (e) { return dflt; }
    },
    set: function (k, v) {
      try { localStorage.setItem("phazermania." + k, JSON.stringify(v)); } catch (e) { /* private mode: keep going */ }
    }
  };
  function readHash() {
    var h = decodeURIComponent((location.hash || "").replace(/^#/, "")).split("/");
    var out = {};
    if (h[0] && byId[h[0]]) out.modelId = h[0];
    else if (h[0] && viewExists(h[0])) out.view = pageOf(h[0]);
    if (h[1] && viewExists(h[1])) out.view = pageOf(h[1]);
    return out;
  }
  function writeHash() {
    var h = "#" + state.modelId + (state.view === "specs" ? "" : "/" + state.view);
    if (location.hash !== h) {
      try { history.replaceState(null, "", h); } catch (e) { /* sandboxed frame: the link just won't update */ }
    }
  }
  (function restore() {
    var saved = store.get("state", {});
    if (saved.modelId && byId[saved.modelId]) state.modelId = saved.modelId;
    if (saved.jet) Object.keys(state.jet).forEach(function (k) { if (saved.jet[k] != null) state.jet[k] = String(saved.jet[k]); });
    var fromHash = readHash();
    if (fromHash.modelId) state.modelId = fromHash.modelId;
    if (fromHash.view) state.view = fromHash.view;
  })();
  function persist() {
    store.set("state", { modelId: state.modelId, jet: state.jet });
    writeHash();
  }

  var secNav = document.getElementById("secnav"), pageNav = document.getElementById("pagenav");
  function badgeHtml(n) { return n ? ' <span class="badge" aria-label="' + n + ' on the order list">' + n + "</span>" : ""; }
  function renderNav() {
    var cur = PAGES[state.view].sec;
    secNav.innerHTML = SECTIONS.map(function (sec) {
      var on = sec === cur;
      return '<button type="button" class="sectab" data-sec="' + sec.id + '"' + (on ? ' aria-current="page"' : "") + ">" +
        '<span class="long">' + esc(sec.label) + '</span><span class="short">' + esc(sec.short) + "</span>" +
        (sec.id === "parts" ? badgeHtml(order.length) : "") + "</button>";
    }).join("");
    pageNav.innerHTML = cur.pages.map(function (p) {
      var on = p.id === state.view && !state.q.trim();
      return '<button type="button" class="pagebtn" data-page="' + p.id + '"' + (on ? ' aria-current="page"' : "") + ">" +
        esc(p.label) + (p.id === "order" ? badgeHtml(order.length) : "") + "</button>";
    }).join("");
  }
  secNav.addEventListener("click", function (e) {
    var b = e.target.closest("[data-sec]");
    if (!b) return;
    var sec = SECTIONS.filter(function (s) { return s.id === b.getAttribute("data-sec"); })[0];
    selectView(lastPage[sec.id] || sec.pages[0].id);

  pageNav.addEventListener("click", function (e) {
    var b = e.target.closest("[data-page]");
    if (b) selectView(b.getAttribute("data-page"));

  /* Go to a page. A search in progress is cleared so the page shows. `anchor`

  function selectView(id, focus, anchor) {

    var changed = id !== state.view || state.q.trim();
    state.view = id; lastPage[PAGES[id].sec.id] = id;

      var el = document.getElementById(anchor);
      if (el) { el.scrollIntoView({ block: "center" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }

  /* ================= sled picker =================

  var sledSelect = document.getElementById("sledSelect");
  function renderSledPicker() {
    var g = activeSled(), list = garageLoad(), html = "";
    if (list.length) {
      html += '<optgroup label="My garage">' + list.map(function (x) {
        var xm = byId[x.modelId];
        return '<option value="g:' + esc(x.id) + '"' + (g && g.id === x.id ? " selected" : "") + ">" + esc(x.name) +
          (xm ? " · " + xm.year + " " + esc(xm.variant) : "") + "</option>";
      }).join("") + "</optgroup>";
    }
    var years = [];
    MODELS.forEach(function (m) { if (years.indexOf(m.year) < 0) years.push(m.year); });
    html += years.map(function (y) {
      return '<optgroup label="' + y + '">' + MODELS.filter(function (m) { return m.year === y; }).map(function (m) {
        return '<option value="' + esc(m.id) + '"' + (!g && m.id === state.modelId ? " selected" : "") + ">" +
          y + " " + esc(m.variant) + " (" + esc(m.code) + ")</option>";
      }).join("") + "</optgroup>";
    }).join("");
    sledSelect.innerHTML = html;
  }
  sledSelect.addEventListener("change", function () {
    var v = sledSelect.value;
    if (v.indexOf("g:") === 0) {
      var g = garageLoad().filter(function (x) { return "g:" + x.id === v; })[0];
      if (g) { useSled(g); return; }
    }
    store.set("garageActive", null);
    pickModel(v);
  });
  function pickModel(id) {
    if (!byId[id]) return;
    state.modelId = id;
    refreshSled();
  }
  function refreshSled() { render(); }

  /* ================= atmosphere + jetting math =================
     Mikuni's correction factor is a straight air-density ratio:
       CF = sqrt( (P/P0) x (T0/T) ),  T absolute
     Pressure from the ISA troposphere model. Jet number scales with CF.
     Sanity checks that match the shop rules of thumb:
       +2000 ft, same temp -> CF 0.964 -> 143.8 becomes 138.6 (one rung down)
       32F -> 0F at sea level -> CF 1.034 -> 143.8 becomes 148.7 (one to two up) */
  function pressureRatio(ft) {
    var m = ft * 0.3048;
    return Math.pow(1 - 2.25577e-5 * m, 5.25588);
  }
  function densityIndex(ft, degF) {
    return pressureRatio(ft) / (degF + 459.67);   // proportional to air density
  }
  function correctionFactor(ft, degF, refFt, refF) {
    return Math.sqrt(densityIndex(ft, degF) / densityIndex(refFt, refF));
  }
  function nearestJet(target) {
    var best = null, bd = Infinity;
    S.carburetor.mainJetLadder.forEach(function (j) {
      var d = Math.abs(parseFloat(j.size) - target);
      if (d < bd) { bd = d; best = j; }
    });
    return best;
  }
  function ladderIndex(size) {
    for (var i = 0; i < S.carburetor.mainJetLadder.length; i++) {
      if (S.carburetor.mainJetLadder[i].size === size) return i;
    }
    return -1;
  }

  /* Which factory altitude chart applies to a sled. Yamaha recalibrated twice:
     1984-89, 1990, and 1991. Nothing later is in the local manuals, so 1992-95
     and the Venture get the 1991 chart marked as the nearest, not as theirs. */
  function chartFor(m) {
    var C = S.carburetor.altitudeCharts;
    if (m.year <= 1989) return { key: "pz8489", chart: C.pz8489, own: true };
    if (m.year === 1990) return { key: "pz1990", chart: C.pz1990, own: true };
    return { key: "pz1991", chart: C.pz1991, own: m.year === 1991 && m.family === "Phazer II" };
  }
  /* Which clutch setting table applies, or null when no manual covers the sled. */
  function clutchFor(m) {
    var E = S.clutch.eras;
    if (m.family === "Phazer") return E.pz8489;
    if (m.family !== "Phazer II") return null;
    if (m.year === 1990) return E.pz1990;
    if (m.year === 1991) return /ST/.test(m.code) ? E.pz1991st : E.pz1991;
    return null;
  }
  function cToF(c) { return Math.round(c * 9 / 5 + 32); }

  /* Locate the answer in a Yamaha altitude x temperature chart. A "zones" chart
     has three temperature columns that are bands, not points: cold below -20 C,
     mid -20 to 0, warm 0 and up. A "ranges" chart (1984-89) has arrows with their
     own ends, which can overlap. Altitude and temperature clamp to the edges. */
  function factoryPick(chart, altFt, degF) {
    var degC = (degF - 32) * 5 / 9;
    var rows = chart.format === "ranges" ? chart.rows : chart.bands;
    var band = null;
    for (var i = 0; i < rows.length; i++) {
      if (altFt < rows[i].ftMax) { band = rows[i]; break; }
    }
    if (!band) band = rows[rows.length - 1];
    /* Name only the edges actually crossed, so the warning never cites a limit the rider is inside. */
    var edges = [];
    if (altFt > 10000) edges.push("above 10,000 ft");
    if (altFt < 0) edges.push("below sea level");
    if (degC > 20) edges.push("warmer than 20 °C (68 °F)");
    if (degC < -30) edges.push("colder than −30 °C (−22 °F)");
    var out = { band: band, clamped: edges.length > 0, edges: edges, bandIndex: rows.indexOf(band), degC: degC };
    if (chart.format === "ranges") {
      var t = Math.max(-30, Math.min(20, degC));
      var hits = band.ranges.filter(function (r) {
        return (r.fromC == null || t >= r.fromC) && (r.toC == null || t <= r.toC);
      });
      if (!hits.length) {
        /* A gap between arrows: take the arrow whose end is nearest. */
        var best = null, bd = Infinity;
        band.ranges.forEach(function (r) {
          var d = Math.min(r.fromC == null ? Infinity : Math.abs(t - r.fromC), r.toC == null ? Infinity : Math.abs(t - r.toC));
          if (d < bd) { bd = d; best = r; }
        });
        hits = [best];
      }
      hits.sort(function (a, b) { return parseFloat(b.jet) - parseFloat(a.jet); });
      out.size = hits[0].jet;
      out.sizes = hits.map(function (r) { return r.jet; });
      out.zoneLabel = Math.round(degC) + " °C";
    } else {
      var zoneKey = degC < -20 ? "cold" : (degC < 0 ? "mid" : "warm");
      out.zone = chart.zones.filter(function (z) { return z.key === zoneKey; })[0];
      out.size = band[zoneKey];
      out.sizes = [out.size];
      out.zoneLabel = out.zone.label;
      out.note = zoneKey === "warm" ? band.warmNote : null;
    }
    return out;
  }

  function updateJetting() {
    var carb = S.carburetor;
    var alt = parseFloat(state.jet.alt) || 0;
    var tmp = parseFloat(state.jet.temp);
    var refA = parseFloat(state.jet.refAlt) || 0;
    var refT = parseFloat(state.jet.refTemp);
    if (isNaN(tmp)) tmp = 20;
    if (isNaN(refT)) refT = 32;
    var pipe = PIPES[state.jet.pipe] || PIPES.stock;
    var m = byId[state.modelId];

    /* Yamaha's table is the answer. The density maths is only a cross-check. */
    var fc = factoryPick(chartFor(m).chart, alt, tmp);
    var factorySize = fc.size;
    var factoryJet = carb.mainJetLadder[ladderIndex(factorySize)] || nearestJet(parseFloat(factorySize));

    /* A pipe shifts the factory answer up the ladder. */
    var pickIdx = Math.min(carb.mainJetLadder.length - 1, ladderIndex(factoryJet.size) + pipe.steps);
    var pick = carb.mainJetLadder[pickIdx];
    var pickPn = jetPnFor(m, pick);

    var cf = correctionFactor(alt, tmp, refA, refT);
    var target = parseFloat(carb.mainJetStd.size) * cf;
    var dens = densityIndex(alt, tmp) / densityIndex(refA, refT);
    var computedPick = nearestJet(target);
    var pilot = Math.round((pipe.pilot * cf) / 5) * 5;
    var agrees = computedPick.size === factoryJet.size;

    highlightChart(fc);

    var h = '<div class="result"><div class="result-top">' +
      '<div><span class="biglabel">Main jet — Yamaha table</span><span class="big">' + pick.size + "</span></div>" +
      '<div><span class="biglabel">Order</span><button class="pn pnbig" data-pn="' + esc(pickPn.pn) + '">' + esc(pickPn.pn) + "</button>" + addBtn(pickPn.pn, 2) +
        '<span class="biglabel" style="margin:6px 0 0;text-transform:none;letter-spacing:0">' +
        (pickPn.listed ? "As listed for the " + m.year + " " + esc(m.variant) : "Catalogue number; not on this model\u2019s diagram") +
        (pick.alt ? " &middot; also sold as " + esc([pick.pn].concat(pick.alt).filter(function (x) { return x !== pickPn.pn; }).join(", ")) : "") +

        " the factory #" + carb.mainJetStd.size + ". Buy two — it is a twin.</span></div>";

    h += '<div class="verdict"><span class="vlabel">Pilot jet</span><span>Only the <b>#' + carb.pilotJetStd.size +
      "</b> pilot (" + esc(carb.pilotJetStd.pn) + ") appears in Yamaha’s catalogue for this carburettor, so there are no other pilot part numbers in this data. " +
      "The ~" + pilot + " figure above is the same density correction applied to the pilot, for reference against jets you source elsewhere.</span></div>";

        esc(carb.mainNozzleAlternates[1].pn) + " if it is still lean; that pair is reported as the richest combination. The 1A " +
        esc(carb.mainNozzleAlternates[0].pn) + " is the other bulletin option. Stock is 3A " + esc(carb.mainNozzleStd.pn) + ".</span></div>";
      h += '<div class="verdict warn"><span class="vlabel">Burn-down risk</span><span>Forum reports include a piston burned within six miles on 148 mains with the two-hole primary, ' +
        "and melted pistons traced to belt dust blocking the carburettor vent tubes. Read the plugs after every change. More in " + goLink("mods", "Mods &amp; upgrades") + ".</span></div>";

  function updateTrack() {
    var m = byId[state.modelId], t = S.tracks[m.track] || {};
    var len = parseFloat(document.getElementById("tLen").value);
    var lug = parseFloat(document.getElementById("tLug").value);
    var teeth = parseInt(document.getElementById("tDriver").value, 10);
    var h = "";

    /* Length: governed by rails + tunnel, so anything off-stock needs the matching skid. */
    if (len === t.lengthIn) {
      h += '<div class="verdict ok"><span class="vlabel">Length OK</span><span>' + len +
        '" is what this sled came with. Direct swap on the stock skid.</span></div>';
    } else if (len < t.lengthIn) {
      h += '<div class="verdict warn"><span class="vlabel">Shorter than stock</span><span>Going from ' + t.lengthIn +
        '" down to ' + len + '" means the shorter rails and the matching skid. The tunnel stays, but you’ll have unsupported overhang at the back.</span></div>';
    } else {
      var isKnown = (t.lengthIn === 121 && (len === 136 || len === 133));
      h += '<div class="verdict warn"><span class="vlabel">Longer than stock</span><span>' + t.lengthIn + '" to ' + len + '" needs ' +
        (isKnown ? "the <b>ST long-track rails and skid</b> — Yamaha did exactly this swap themselves, which is what the ST models are. Track " +
                   esc("8BH-47110-00-00") + " is the 136." : "longer rails and almost certainly a <b>tunnel extension</b>.") +
        " Budget for the skid, not just the track.</span></div>";
    }

    /* Lug: the numbers builders report on this chassis (forum consensus, see Mods & upgrades). */
    if (lug <= 0.75) {
      h += '<div class="verdict ok"><span class="vlabel">Lug OK</span><span>' + lug +
        '" is at or near stock height. No clearance concerns.</span></div>';
    } else if (lug <= 1.25) {
      h += '<div class="verdict ok"><span class="vlabel">Lug OK</span><span>Up to 1&frac14;" is the most-reported <b>safe choice on the stock 8-tooth drivers</b>. ' +
        (lug === 1.25 ? "It is snug at the front of the tunnel, and the stock drivers are awkward to refit, but riders run it widely." : "Riders report plenty of room.") + "</span></div>";
    } else if (lug <= 1.5) {
      if (teeth === 8) {
        h += '<div class="verdict warn"><span class="vlabel">At the limit</span><span>1&frac12;" on 8-tooth drivers is reported to fit with about 3/8" to spare on one sled, ' +
          "but others say it slaps the tunnel and bulkhead under compression or when the track balloons. Drop brackets, or lowering the front arm about 5/8\", buy room. 7-tooth drivers make it comfortable.</span></div>";
      } else {
        h += '<div class="verdict ok"><span class="vlabel">Lug OK</span><span>1&frac12;" on 7-tooth drivers is a reported, workable combination. 7-tooth drivers gear the sled down about as much as two teeth off the top gear.</span></div>';
      }
    } else {
      h += '<div class="verdict ' + (teeth === 7 && lug <= 1.75 ? "warn" : "stop") + '"><span class="vlabel">' + (teeth === 7 && lug <= 1.75 ? "Tight" : "Needs work") + "</span><span>At " + lug +
        '" you need <b>7-tooth drivers</b>' + (lug > 1.75 ? ", and riders who run 2\" paddles have trimmed the front tunnel metal" : "; riders report 1&frac34;\" fits on them, tightly") +
        ". Snow evacuation and the track's bend over the smaller drivers both suffer.</span></div>";
      if (teeth === 8) {
        h += '<div class="verdict stop"><span class="vlabel">Driver conflict</span><span>You have 8-tooth selected. Nobody reports clearing more than 1&frac12;" on the stock drivers.</span></div>';
      }
    }
    h += '<p class="note">Lug clearances are forum-reported, from riders who have done the swap; Yamaha and Camoplast publish no maximum. Sources and detail in ' + goLink("mods", "Mods &amp; upgrades") + ".</p>";
    document.getElementById("tResult").innerHTML = h;
  }

  function calcSave(vals) { var c = store.get("calc", {}); Object.keys(vals).forEach(function (k) { c[k] = vals[k]; }); store.set("calc", c); }
  function mphFor(rpm, clutch, drive, driven, teeth) {
    var inPerMin = rpm / clutch / (driven / drive) * teeth * S.calc.driverPitchIn;
    return inPerMin * 60 / 63360;
  }
  function updateGear() {
    var G = S.gearRatios, v = function (id) { return document.getElementById(id).value; };
    var drive = parseInt(v("gDrive"), 10), driven = parseInt(v("gDriven"), 10), teeth = parseInt(v("gTeeth"), 10);
    var rpm = parseFloat(v("gRpm")), clutch = parseFloat(v("gClutch"));
    calcSave({ drive: drive, driven: driven, teeth: teeth, rpm: rpm, clutch: clutch });
    var h;
    if (!(rpm > 0) || !(clutch > 0)) {
      h = '<div class="verdict warn"><span class="vlabel">Check inputs</span><span>Enter an engine rpm and a clutch ratio above zero.</span></div>';
    } else {
      var mph = mphFor(rpm, clutch, drive, driven, teeth);
      var std = mphFor(rpm, clutch, G.stdDrive, G.stdDriven, 8);
      var diff = (mph / std - 1) * 100;
      var row = G.driven.filter(function (r) { return r.teeth === driven; })[0];
      var links = row ? row.links[G.drive.indexOf(drive)] : null;
      h = '<div class="result"><div class="result-top">' +
        '<div><span class="biglabel">Theoretical top speed</span><span class="big">' + mph.toFixed(0) + ' mph</span></div>' +
        '<div><span class="biglabel">Kilometres</span><span class="big">' + (mph * 1.609344).toFixed(0) + " km/h</span></div></div>" +
        '<div class="readout"><span>Chaincase ratio <b>' + (driven / drive).toFixed(3) + "</b></span>" +
        "<span>Overall at top <b>" + (driven / drive * clutch).toFixed(2) + ":1</b></span>" +
        "<span>Chain <b>" + (links ? links + " links (Table 4)" : "no length in the chart; measure") + "</b></span>" +
        "<span>vs stock 17/29, 8T <b>" + (Math.abs(diff) < 0.05 ? "same" : (diff > 0 ? "+" : "") + diff.toFixed(1) + "%") + "</b></span></div></div>";
      if (diff < -0.05) h += '<div class="verdict ok"><span class="vlabel">Geared down</span><span>More pull for deep snow, taller lugs or a longer track; less top speed. This is the direction Yamaha gives for poor snow and rough terrain.</span></div>';
      else if (diff > 0.05) h += '<div class="verdict warn"><span class="vlabel">Geared up</span><span>More top speed only if the engine can still pull its peak rpm. If rpm drops on the lake, it is overgeared.</span></div>';
    }
    document.getElementById("gResult").innerHTML = h;
  }
  function updateMix() {
    var v = function (id) { return document.getElementById(id).value; };
    var fuel = parseFloat(v("pFuel")), unit = v("pUnit"), ratio = parseInt(v("pRatio"), 10);

    } else {

        '<div class="readout"><span>' + fuel + " " + (unit === "gal" ? "US gal" : "L") + " at <b>" + ratio + ":1</b></span>" +
        "<span>Per US gallon <b>" + (128 / ratio).toFixed(1) + " oz</b></span><span>Per litre <b>" + Math.round(1000 / ratio) + " ml</b></span></div></div>";
    }
    document.getElementById("pResult").innerHTML = p;
  }


  /* ---------------- maintenance schedule + service log ----------------
     Yamaha's interval table, plus a per-sled record of when each item was last
     done. Due-ness is worked out from the hours or miles typed in (whichever
     comes first, as Yamaha writes it) and, for seasonal items, from the date:
     a season is taken to start on 1 August. Saved in this browser only. */
  function svcKey() { var g = activeSled(); return g ? "g:" + g.id : state.modelId; }
  function svcLoad() { var all = store.get("service", {}); return all[svcKey()] || { hours: "", miles: "", done: {}, history: [] }; }
  function svcSave(rec) { var all = store.get("service", {}); all[svcKey()] = rec; store.set("service", all); }
  function seasonStart() {
    var d = new Date(), y = d.getMonth() >= 7 ? d.getFullYear() : d.getFullYear() - 1;
    return y + "-08-01";
  }
  function svcStatus(it, rec) {
    var MT = S.maintenance, last = rec.done[it.key], H = parseFloat(rec.hours), MI = parseFloat(rec.miles);
    var worst = null, why = "";
    it.at.forEach(function (a) {
      var iv = MT.intervals[a], st = null, w = "";
      if (a === "when") return;
      if (a === "season") {
        st = !last ? "none" : last.date >= seasonStart() ? "ok" : "due";
        w = st === "ok" ? "done this season" : st === "none" ? "no record" : "not done since 1 Aug";
      } else if (!last) {
        st = "none"; w = "no record";
      } else {

      '<div id="idSnOut"></div><p class="note">' + esc(D.where) + " " + esc(D.note) + "</p></section>";
    var sel = function (id, label, val, list) {
      return '<div class="field"><label for="' + id + '">' + label + '</label><select id="' + id + '"><option value="">Not sure</option>' +
        list.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === val ? " selected" : "") + ">" + o[1] + "</option>"; }).join("") + "</select></div>";
    };
    html += '<section class="group"><h2>By what you can see</h2><div class="calc">' +
      sel("idSeat", "Seat", f.seat, [["one", "One rider"], ["two", "Two-up touring with backrest"]]) +
      sel("idStart", "Electric start", f.start, [["electric", "Yes (key start)"], ["recoil", "No, pull start only"]]) +
      sel("idLen", "Track length", f.len, [["116", '116"'], ["121", '121"'], ["136", '136"']]) +
      '</div><div id="idOut"></div><p class="note">' + esc(D.gaps) + " Measure the track around its outside, or count the windows: the first-generation 116&quot; track has 46. " + esc(D.trackLenNote) + "</p></section>";
    html += '<p class="note">Sources: ' + esc(D.source) + "</p>";
    main.innerHTML = html;

    var draw = function () {
      var sn = f.sn.toUpperCase().replace(/[^0-9A-Z]/g, ""), out = "";
      if (sn.length >= 3) {
        var hit = D.prefixes.filter(function (x) { return x.prefix === sn.slice(0, 3); })[0];
        if (hit && hit.modelId && byId[hit.modelId]) {
          var mm = byId[hit.modelId];
          out = '<div class="verdict ok"><span class="vlabel">' + esc(hit.prefix) + "</span><span><b>" + mm.year + " " + esc(mm.variant) + " (" + esc(mm.code) + ")</b>. Production started at " + esc(hit.start) + '. <button type="button" class="linkbtn" data-idgo="' + esc(mm.id) + '">Open its spec sheet</button></span></div>';
        } else if (hit) {
          out = '<div class="verdict warn"><span class="vlabel">' + esc(hit.prefix) + "</span><span>" + esc(hit.label) + ", which is outside the 1986&ndash;1995 range this app covers.</span></div>";
        } else {
          out = '<div class="verdict warn"><span class="vlabel">Not listed</span><span>' + esc(sn.slice(0, 3)) + " is not in the manuals checked. " + esc(D.gaps) + "</span></div>";
        }
      }
      document.getElementById("idSnOut").innerHTML = out;
      var c = MODELS.filter(function (m) {
        var len = D.trackLenOverride[m.id] || (S.tracks[m.track] || {}).lengthIn;
        if (f.seat === "two" && m.family !== "Venture") return false;
        if (f.seat === "one" && m.family === "Venture") return false;
        if (f.start && m.start !== f.start) return false;
        if (f.len && String(len) !== f.len) return false;
        return true;
      });
      var o;
      if (!c.length) o = '<div class="verdict warn"><span class="vlabel">No match</span><span>No 1986&ndash;1995 model has that combination as it left the factory. A track or skid may have been changed; try &ldquo;Not sure&rdquo; for the track.</span></div>';
      else {

          '<div class="tablewrap"><table><thead><tr><th>Year</th><th>Model</th><th>Code</th><th>Serial starts</th></tr></thead><tbody>' + c.map(function (m) {
            var px = D.prefixes.filter(function (x) { return x.modelId === m.id; })[0];

          }).join("") + "</tbody></table></div>";

      }

      Array.prototype.forEach.call(main.querySelectorAll("[data-idgo]"), function (b) {
        b.addEventListener("click", function () { store.set("garageActive", null); state.modelId = b.getAttribute("data-idgo"); renderSledPicker(); selectView("specs"); });
      });

      html += "</tbody></table></div><p class=\"note\">" + esc(g.source) + "</p></section>";
    });

    html += '<p class="note">Clutch springs are under ' + goLink("clutch", "Tune &rsaquo; Clutching") + "; crankshaft limits under " + goLink("limits", "Service limits") + ".</p>";
    main.innerHTML = html;
  }

  /* ---------------- service limits ----------------
     Capacities, adjustments and wear limits in one place, with the same source
     badge as the spec sheet. */
  function limitsHtml(m) {
    var src = m.specSource, cl = clutchFor(m), html = "";
    html += '<section class="group"><h2>Capacities' + badge(src === "clymer8489", "From the 1984-89 PZ480 tables; not checked for this model") + '</h2><dl class="specgrid">';
    html += row("Fuel tank", S.capacities.fuelTank) + row("Oil tank", S.capacities.oilTank) + row("Chaincase oil", S.capacities.chaincase);
    html += "</dl></section>";
    html += '<section class="group"><h2>Adjustments' + badge(src === "clymer8489", "From the 1984-89 PZ480 tables; not checked for this model") + '</h2><dl class="specgrid">';
    html += row("Track deflection", S.service.trackDeflection) + row("Toe-out", S.service.toeOut);
    html += row("Throttle free play", S.service.throttleCableFreePlay) + row("Oil pump cable", S.service.oilPumpCableFreePlay);
    html += row("Starter cable free play", S.service.starterCableFreePlay);
    html += "</dl></section>";
    html += '<section class="group"><h2>Wear limits' + badge(src === "clymer8489", "From the 1984-89 PZ480 tables; not checked for this model") + '</h2><dl class="specgrid">';
    html += row("Belt circumference", S.clutch.beltOutsideCircumference) + row("Belt width, new", S.clutch.beltWidthNew);
    html += row("Belt width limit", S.clutch.beltWidthWearLimit);
    html += row("Brake disc OD", S.service.brakeDiscOuterDiameter) + row("Brake disc thickness", S.service.brakeDiscThickness);
    html += row("Pad-to-disc clearance", S.service.padToDiscClearance);
    html += "</dl></section>";
    return html;
  }
  function renderLimits(main) {
    var m = byId[state.modelId], CR = S.crankshaft;
    var html = sledHead(m, "Service limits", "") + "</div>";
    html += limitsHtml(m);
    html += '<section class="group"><h2>Crankshaft limits</h2>' +
      '<div class="tablewrap"><table><thead><tr><th>Item</th><th>mm</th><th>in</th></tr></thead><tbody>' +
      CR.rows.map(function (r, i) {
        return '<tr id="cr-' + i + '"><td>' + esc(r.item) + '</td><td class="mono">' + esc(r.mm) + '</td><td class="mono">' + esc(r["in"]) + "</td></tr>";
      }).join("") +
      "</tbody></table></div><p class=\"note\">" + esc(CR.source) + "</p></section>";

    html += '<p class="note">Read off the <strong>PZ480 1984&ndash;89</strong> tables. The Phazer II shares the engine and carburettor, but its suspension was revised, and the Venture is a touring setup &mdash; treat the deflection figures as the Phazer baseline unless you have the matching manual page.</p>';
    main.innerHTML = html;
  }

  function renderChanges(main) {
    var FIELDS = [
      { key: "track", label: "Track" }, { key: "slide", label: "Slide rail" },
      { key: "belt", label: "Drive belt" }, { key: "primarySpring", label: "Primary spring" },
      { key: "cdi", label: "CDI unit" }, { key: "coil", label: "Ignition coil" },
      { key: "brakeDisc", label: "Brake disc" }
    ];
    var FAMS = ["Phazer", "Phazer II", "Venture"];

    var html = '<div class="sheet-head"><h2 class="sheet-title">What changed, and when</h2>' +
      '<div class="sheet-sub"><span>One row per model line; consecutive years sharing a part number are collapsed into one run</span></div></div>';
    /* A model line is a family plus its variant, with the long-track suffix folded in,
       so a 1994 "Phazer II ST (LT)" continues the 1991-93 "Phazer II ST" line. */
    function lineOf(m) { return m.variant.replace(/\s*\(LT\)$/, ""); }

    FIELDS.forEach(function (f) {
      html += '<section class="group"><h2>' + esc(f.label) + "</h2>";
      FAMS.forEach(function (fam) {
        var ms = MODELS.filter(function (m) { return m.family === fam; })
                       .sort(function (a, b) { return a.year - b.year; });
        if (!ms.length) return;
        var lines = [];
        ms.forEach(function (m) { if (lines.indexOf(lineOf(m)) < 0) lines.push(lineOf(m)); });
        lines.forEach(function (ln) {
          /* Collapse consecutive years of this line that share the value. */
          var runs = [];
          ms.filter(function (m) { return lineOf(m) === ln; }).forEach(function (m) {
            var v = m[f.key];
            var last = runs[runs.length - 1];
            if (last && last.v === v) { last.to = m.year; last.models.push(m); }
            else runs.push({ v: v, from: m.year, to: m.year, models: [m] });
          });
          html += '<div style="margin-bottom:12px"><div class="rail-head">' + esc(ln) + "</div><div class=\"runs\">";
          runs.forEach(function (r, i) {
            if (i) html += '<span class="arrow">&rarr;</span>';
            var yrs = r.from === r.to ? String(r.from) : r.from + "–" + r.to;
            var codes = r.models.map(function (m) { return m.code; }).join(", ");
            html += '<div class="run' + (i ? " changed" : "") + '"><span class="years">' + yrs + "</span>" +
              '<button class="pn val" data-pn="' + esc(r.v) + '">' + esc(r.v) + "</button>" +
              '<span class="val" style="font-family:inherit">' + esc(codes) + "</span></div>";
          });
          html += "</div></div>";
        });
      });
      html += "</section>";
    });

    html += '<p class="note">Each row follows one model line (standard, LE, ST, XL, GT) through the years, so a change in a row is a real change for that sled. Click any number to copy it.</p>';
    main.innerHTML = html;
    wirePnButtons(main);
  }

  /* ---------------- order list ---------------- */
  function partzillaSearch(pn) { return "https://www.partzilla.com/search?q=" + encodeURIComponent(pn); }
  function orderText() {
    return order.map(function (x) {
      var d = describe(x.pn);
      return x.qty + " x " + x.pn + (d ? "  " + d : "");
    }).join("\n");
  }
  function renderOrder(main) {
    var html = '<div class="sheet-head"><h2 class="sheet-title">Order list</h2>' +
      '<div class="sheet-sub"><span>Parts you have marked with <b>+ list</b>, saved in this browser</span></div></div>';
    if (!order.length) {
      main.innerHTML = html + '<p class="empty">The list is empty. Use the <b>+ list</b> buttons in the parts index, part search, jetting result or spring tables to add parts.</p>';
      return;
    }
    html += '<div class="tablewrap"><table><thead><tr><th>Qty</th><th>Part</th></tr></thead><tbody>' +
      order.map(function (x, i) {
        var d = describe(x.pn);
        return "<tr><td><input class=\"qty\" type=\"number\" min=\"1\" max=\"99\" inputmode=\"numeric\" data-i=\"" + i + '" value="' + x.qty + '" aria-label="Quantity for ' + esc(x.pn) + '"></td>' +
          "<td>" + (d ? esc(d) : '<span class="gap">not in the parts index</span>') +
          '<div style="margin-top:4px"><button class="pn" data-pn="' + esc(x.pn) + '">' + esc(x.pn) + "</button></div>" +
          '<div class="hit-fits">Listed for ' + esc(fitsText(x.pn)) + " &middot; " +
          '<a class="diagram" href="' + partzillaSearch(x.pn) + '" target="_blank" rel="noopener">Find on Partzilla &rarr;</a> &middot; ' +
          '<button type="button" class="linkbtn" data-del="' + i + '">Remove</button></div></td></tr>';
      }).join("") + "</tbody></table></div>";
    html += '<div class="btnrow"><button type="button" class="btn primary" id="oCopy">Copy list</button>' +
      '<button type="button" class="btn" id="oClear">Clear list</button></div>';
    html += '<p class="note">Copy the list into an email or a dealer\u2019s order form. Part numbers are Partzilla\u2019s current replacement numbers; check the description against your sled before ordering.</p>';
    main.innerHTML = html;
    wirePnButtons(main);
    Array.prototype.forEach.call(main.querySelectorAll("input.qty"), function (el) {
      el.addEventListener("change", function () {
        var n = parseInt(el.value, 10);
        order[+el.getAttribute("data-i")].qty = n > 0 ? Math.min(n, 99) : 1;
        orderSave();
      });
    });
    Array.prototype.forEach.call(main.querySelectorAll("[data-del]"), function (b) {
      b.addEventListener("click", function () { order.splice(+b.getAttribute("data-del"), 1); orderSave(); render(); });
    });
    document.getElementById("oCopy").addEventListener("click", function () { copyText(orderText(), "Order list copied"); });
    document.getElementById("oClear").addEventListener("click", function () {
      if (window.confirm("Remove every part from the order list?")) { order = []; orderSave(); render(); }
    });
  }

  /* ---------------- tuning log ----------------
     Each entry: { id, date, modelId, alt, temp, main, pilot, plug, notes }.
     Saved in this browser; Export makes a CSV the rider can keep. */
  var PLUGS = ["Not checked", "Tan / light coffee (right)", "Grey or white (lean)", "Black, dry soot (rich)", "Wet or oily", "Other, see notes"];
  function logLoad() { var l = store.get("log", []); return Array.isArray(l) ? l : []; }
  function logSave(l) { store.set("log", l); }
  function todayIso() {
    var d = new Date(), z = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
  }
  function csvCell(v) { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function renderLog(main) {
    var log = logLoad();
    var draft = state.logDraft && state.lastPick ? state.lastPick : null;
    state.logDraft = false;
    var m = byId[state.modelId];
    var html = '<div class="sheet-head"><h2 class="sheet-title">Tuning log</h2>' +
      '<div class="sheet-sub"><span>What you ran, where, and how the plugs read. Saved in this browser only</span></div></div>';

    html += '<section class="group"><h2>New entry</h2><div class="calc">' +
      '<div class="field"><label for="lDate">Date</label><input id="lDate" type="date" value="' + todayIso() + '"></div>' +
      '<div class="field"><label for="lModel">Sled</label><select id="lModel">' + MODELS.map(function (x) {
        return '<option value="' + esc(x.id) + '"' + (x.id === m.id ? " selected" : "") + ">" + x.year + " " + esc(x.variant) + "</option>";
      }).join("") + "</select></div>" +
      '<div class="field"><label for="lAlt">Altitude (ft)</label><input id="lAlt" type="number" inputmode="numeric" value="' + esc(state.jet.alt) + '"></div>' +
      '<div class="field"><label for="lTemp">Temperature (&deg;F)</label><input id="lTemp" type="number" inputmode="numeric" value="' + esc(state.jet.temp) + '"></div>' +
      '<div class="field"><label for="lMain">Main jet</label><input id="lMain" type="text" value="' + esc(draft ? draft.main : S.carburetor.mainJetStd.size) + '"></div>' +
      '<div class="field"><label for="lPilot">Pilot jet</label><input id="lPilot" type="text" value="' + esc(S.carburetor.pilotJetStd.size) + '"></div>' +
      '<div class="field"><label for="lPlug">Plug reading</label><select id="lPlug">' +
        PLUGS.map(function (p) { return "<option>" + esc(p) + "</option>"; }).join("") + "</select></div>" +
      "</div>" +
      '<div class="field"><label for="lNotes">Notes</label><textarea id="lNotes" class="field-ta" placeholder="Snow, pipe, needle clip, how it pulled&hellip;"></textarea></div>' +
      '<div class="btnrow"><button type="button" class="btn primary" id="lAdd">Save entry</button></div>' +
      (draft ? '<p class="note">Altitude, temperature and main jet are filled in from the Jetting page.</p>' : "") +
      "</section>";

    html += '<section class="group"><h2>Entries &mdash; ' + log.length + "</h2>";
    if (!log.length) {
      html += '<p class="empty">No entries yet. After a run, note the conditions and the plug colour here, and the pattern shows up over a season.</p>';
    } else {
      html += '<div class="tablewrap"><table><thead><tr><th>Date</th><th>Sled</th><th>Alt ft</th><th>&deg;F</th><th>Main</th><th>Pilot</th><th>Plugs</th><th>Notes</th><th></th></tr></thead><tbody>' +
        log.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id; }).map(function (e) {
          var mm = byId[e.modelId];
          return '<tr><td class="mono">' + esc(e.date) + "</td><td>" + (mm ? mm.year + " " + esc(mm.variant) : esc(e.modelId)) + "</td>" +
            '<td class="mono">' + esc(e.alt) + '</td><td class="mono">' + esc(e.temp) + '</td><td class="mono">#' + esc(e.main) +
            '</td><td class="mono">#' + esc(e.pilot) + "</td><td>" + esc(e.plug) + "</td><td>" + esc(e.notes) + "</td>" +
            '<td><button type="button" class="linkbtn" data-logdel="' + e.id + '">Delete</button></td></tr>';
        }).join("") + "</tbody></table></div>" +
        '<div class="btnrow"><button type="button" class="btn" id="lExport">Export CSV</button>' +
        '<button type="button" class="btn" id="lCopy">Copy as text</button></div>';
    }
    html += '<p class="note">The log lives in this browser on this device. Export it now and then to keep a copy, or to move it to another device.</p></section>';
    main.innerHTML = html;

    document.getElementById("lAdd").addEventListener("click", function () {
      var v = function (id) { return document.getElementById(id).value.trim(); };
      var l = logLoad();
      l.push({ id: Date.now(), date: v("lDate") || todayIso(), modelId: v("lModel"), alt: v("lAlt"), temp: v("lTemp"),
               main: v("lMain").replace(/^#/, ""), pilot: v("lPilot").replace(/^#/, ""), plug: v("lPlug"), notes: v("lNotes") });
      logSave(l); toast("Entry saved"); render();
    });
    Array.prototype.forEach.call(main.querySelectorAll("[data-logdel]"), function (b) {
      b.addEventListener("click", function () {
        if (!window.confirm("Delete this log entry?")) return;
        logSave(logLoad().filter(function (e) { return String(e.id) !== b.getAttribute("data-logdel"); })); render();
      });
    });
    var rows = function () {
      return logLoad().map(function (e) {
        var mm = byId[e.modelId];
        return [e.date, mm ? mm.year + " " + mm.variant + " (" + mm.code + ")" : e.modelId, e.alt, e.temp, e.main, e.pilot, e.plug, e.notes];
      });
    };
    var HEAD = ["Date", "Sled", "Altitude ft", "Temp F", "Main jet", "Pilot jet", "Plug reading", "Notes"];
    var ex = document.getElementById("lExport");
    if (ex) ex.addEventListener("click", function () {
      var csv = [HEAD].concat(rows()).map(function (r) { return r.map(csvCell).join(","); }).join("\n");
      try {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
        a.download = "phazermania-tuning-log.csv";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      } catch (e) { copyText(csv, "Download blocked here, CSV copied instead"); }
    });
    var cp = document.getElementById("lCopy");
    if (cp) cp.addEventListener("click", function () {
      copyText(rows().map(function (r) { return r.join(" | "); }).join("\n"), "Log copied");
    });
  }

  /* A pasted or edited link moves to that sled and page. */
  window.addEventListener("hashchange", function () {
    var h = readHash();
    if (h.modelId && h.modelId !== state.modelId) { state.modelId = h.modelId; renderSledPicker(); }
    selectView(h.view || "specs");
  });

  /* Links to other pages inside a page: data-goto, plus an optional row to show. */
  document.getElementById("main").addEventListener("click", function (e) {
    var b = e.target.closest("[data-goto]");
    if (b) { e.preventDefault(); selectView(b.getAttribute("data-goto"), false, b.getAttribute("data-anchor")); }
  });

  var qEl = document.getElementById("q");
  qEl.addEventListener("input", function () { state.q = qEl.value; render(); });
  qEl.addEventListener("keydown", function (e) { if (e.key === "Escape" && state.q) { e.preventDefault(); clearSearch(); } });

  if (!PAGES[state.view]) state.view = "specs";
  lastPage[PAGES[state.view].sec.id] = state.view;
  renderSledPicker();
  render();

  /* Offline: only the GitHub Pages build links a manifest and ships sw.js. */
  if ("serviceWorker" in navigator && window.isSecureContext && document.querySelector('link[rel="manifest"]')) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        // An installed app can stay open for days. Look for a new deploy each
        // time it comes back to the foreground; the next open then shows it.
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible" && navigator.onLine) reg.update().catch(function () {});
        });
      }).catch(function () { /* offline mode unavailable */ });
    });
  }
})();
</script>
